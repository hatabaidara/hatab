<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Commandes - Shaoume Global Business</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body style="background:#F8FAFC">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="home.html">
      <i class="bi bi-globe2 me-2"></i>Shaoume <span class="text-dark">Global</span>
    </a>
    <div class="d-flex align-items-center gap-3">
      <a href="home.html" class="btn btn-light btn-sm">
        <i class="bi bi-house me-1"></i>Accueil
      </a>
      <a href="cart.html" class="btn btn-light btn-sm">
        <i class="bi bi-bag me-1"></i>Panier
      </a>
      <div class="avatar" id="user-avatar" style="width:36px;height:36px;font-size:0.8rem">AD</div>
    </div>
  </div>
</nav>

<div class="container py-5">

  <div class="d-flex align-items-center gap-3 mb-4">
    <h3 class="fw-bold mb-0">Mes Commandes</h3>
    <span id="orders-badge" class="badge bg-primary">0 commandes</span>
  </div>

  <!-- Liste commandes -->
  <div id="orders-list">
    <div class="text-center py-5">
      <div class="spinner-border text-primary"></div>
      <p class="text-muted mt-2">Chargement...</p>
    </div>
  </div>

  <!-- Pagination -->
  <div class="d-flex justify-content-center mt-4">
    <nav><ul class="pagination" id="pagination"></ul></nav>
  </div>

</div>

<!-- MODAL DETAIL -->
<div class="modal fade" id="orderModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">Détail de la commande</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="order-detail-body">
        <div class="text-center py-4"><div class="spinner-border text-primary"></div></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  if (!checkAuth()) {}
  let currentPage = 0;

  // Icône par statut
  const statusIcons = {
    PENDING: 'bi-clock text-warning',
    CONFIRMED: 'bi-check-circle text-info',
    PROCESSING: 'bi-gear text-primary',
    SHIPPED: 'bi-truck text-secondary',
    DELIVERED: 'bi-check-circle-fill text-success',
    CANCELLED: 'bi-x-circle text-danger',
    REFUNDED: 'bi-arrow-counterclockwise text-warning',
  };

  const statusSteps = ['PENDING', 'CONFIRMED', 'PROCESSING', 'SHIPPED', 'DELIVERED'];

  function getStepIndex(status) {
    return statusSteps.indexOf(status);
  }

  async function loadOrders(page = 0) {
    currentPage = page;
    const container = document.getElementById('orders-list');
    container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';

    try {
      const res = await Api.get(`/orders/my-orders?page=${page}&size=5&sort=createdAt,desc`);
      const data = res.data;
      const orders = data?.content || [];
      const total = data?.totalElements || 0;

      document.getElementById('orders-badge').textContent = total + ' commandes';

      if (orders.length === 0) {
        container.innerHTML = `
          <div class="content-card text-center py-5">
            <i class="bi bi-bag fs-1 text-muted d-block mb-3"></i>
            <h5 class="text-muted">Aucune commande</h5>
            <p class="text-muted mb-4">Vous n'avez pas encore passé de commande</p>
            <a href="home.html" class="btn btn-primary">
              <i class="bi bi-shop me-2"></i>Commencer les achats
            </a>
          </div>`;
        return;
      }

      container.innerHTML = orders.map(o => {
        const stepIndex = getStepIndex(o.status);
        const isCancelled = o.status === 'CANCELLED';
        return `
          <div class="content-card mb-4">
            <!-- Header commande -->
            <div class="content-card-header">
              <div class="d-flex align-items-center gap-3">
                <i class="bi ${statusIcons[o.status] || 'bi-circle'} fs-5"></i>
                <div>
                  <div class="fw-bold">${o.orderNumber}</div>
                  <div class="text-muted" style="font-size:0.8rem">${Format.date(o.createdAt)}</div>
                </div>
              </div>
              <div class="d-flex align-items-center gap-3">
                <span class="fw-bold text-primary">${Format.currency(o.totalAmount)}</span>
                ${Format.statusBadge(o.status)}
                <button class="btn btn-sm btn-outline-primary" onclick="viewOrder('${o.orderNumber}')">
                  <i class="bi bi-eye me-1"></i>Détails
                </button>
              </div>
            </div>

            <div class="content-card-body">
              <!-- Progression -->
              ${!isCancelled ? `
              <div class="mb-4">
                <div class="d-flex justify-content-between position-relative" style="padding:0 10px">
                  <div class="position-absolute" style="top:12px;left:10%;right:10%;height:2px;background:#E5E7EB;z-index:0">
                    <div style="width:${Math.max(0, stepIndex / (statusSteps.length-1) * 100)}%;height:100%;background:#2563EB;transition:width 0.5s"></div>
                  </div>
                  ${statusSteps.map((step, i) => `
                    <div class="text-center position-relative" style="z-index:1">
                      <div class="mx-auto rounded-circle d-flex align-items-center justify-content-center"
                        style="width:24px;height:24px;background:${i <= stepIndex ? '#2563EB' : '#E5E7EB'};color:${i <= stepIndex ? 'white' : '#94A3B8'}">
                        <i class="bi ${i < stepIndex ? 'bi-check' : i === stepIndex ? 'bi-circle-fill' : 'bi-circle'}" style="font-size:0.7rem"></i>
                      </div>
                      <div style="font-size:0.65rem;color:${i <= stepIndex ? '#2563EB' : '#94A3B8'};margin-top:4px;white-space:nowrap">
                        ${['Commande', 'Confirmée', 'En cours', 'Expédiée', 'Livrée'][i]}
                      </div>
                    </div>`).join('')}
                </div>
              </div>` : `
              <div class="alert alert-danger d-flex align-items-center gap-2 mb-4" style="font-size:0.85rem">
                <i class="bi bi-x-circle-fill"></i>
                Cette commande a été annulée
              </div>`}

              <!-- Articles -->
              <div class="d-flex gap-3 flex-wrap">
                ${(o.orderItems || []).slice(0, 4).map(item => `
                  <div class="d-flex align-items-center gap-2 p-2 bg-light rounded-2">
                    <div class="rounded-2 overflow-hidden bg-white" style="width:44px;height:44px;min-width:44px">
                      ${item.product?.imageUrl
                        ? `<img src="${item.product.imageUrl}" style="width:44px;height:44px;object-fit:cover">`
                        : `<div class="d-flex align-items-center justify-content-center h-100"><i class="bi bi-image text-muted"></i></div>`}
                    </div>
                    <div>
                      <div style="font-size:0.8rem;font-weight:600">${item.product?.name || 'Produit'}</div>
                      <div style="font-size:0.75rem;color:#64748B">x${item.quantity} • ${Format.currency(item.unitPrice)}</div>
                    </div>
                  </div>`).join('')}
                ${o.orderItems?.length > 4 ? `<div class="d-flex align-items-center p-2 text-muted" style="font-size:0.8rem">+${o.orderItems.length - 4} autres</div>` : ''}
              </div>

              <!-- Actions -->
              <div class="d-flex gap-2 mt-3">
                ${o.status === 'PENDING' || o.status === 'CONFIRMED' ? `
                <button class="btn btn-outline-danger btn-sm" onclick="cancelOrder(${o.id})">
                  <i class="bi bi-x-lg me-1"></i>Annuler
                </button>` : ''}
                ${o.status === 'DELIVERED' ? `
                <button class="btn btn-outline-success btn-sm">
                  <i class="bi bi-arrow-repeat me-1"></i>Commander à nouveau
                </button>` : ''}
              </div>
            </div>
          </div>`;
      }).join('');

      buildPagination(data.totalPages, page);
    } catch(e) {
      container.innerHTML = '<div class="content-card text-center text-danger py-4"><i class="bi bi-exclamation-triangle me-2"></i>Erreur de chargement</div>';
    }
  }

  async function viewOrder(orderNumber) {
    const body = document.getElementById('order-detail-body');
    body.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';
    new bootstrap.Modal(document.getElementById('orderModal')).show();
    try {
      const res = await Api.get('/orders/number/' + orderNumber);
      const o = res.data;
      body.innerHTML = `
        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <div class="p-3 bg-light rounded-3">
              <div class="fw-semibold mb-2"><i class="bi bi-geo-alt me-2 text-primary"></i>Livraison</div>
              <div>${o.shippingAddress}</div>
              <div class="text-muted">${o.shippingCity}, ${o.shippingCountry}</div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="p-3 bg-light rounded-3">
              <div class="fw-semibold mb-2"><i class="bi bi-credit-card me-2 text-primary"></i>Paiement</div>
              <div>${o.payment?.method || 'N/A'}</div>
              <div>${Format.statusBadge(o.status)}</div>
            </div>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-sm">
            <thead><tr><th>Produit</th><th>Qté</th><th>Prix unit.</th><th>Total</th></tr></thead>
            <tbody>
              ${(o.orderItems || []).map(item => `
                <tr>
                  <td>${item.product?.name}</td>
                  <td>${item.quantity}</td>
                  <td>${Format.currency(item.unitPrice)}</td>
                  <td class="fw-semibold">${Format.currency(item.totalPrice)}</td>
                </tr>`).join('')}
            </tbody>
            <tfoot>
              <tr class="table-light">
                <td colspan="3" class="fw-bold text-end">Total</td>
                <td class="fw-bold text-primary">${Format.currency(o.totalAmount)}</td>
              </tr>
            </tfoot>
          </table>
        </div>`;
    } catch(e) {
      body.innerHTML = '<div class="text-center text-danger py-4">Erreur de chargement</div>';
    }
  }

  async function cancelOrder(id) {
    if (!confirm('Confirmer l\'annulation de cette commande ?')) return;
    try {
      await Api.post(`/orders/${id}/cancel`);
      Toast.success('Commande annulée');
      loadOrders(currentPage);
    } catch(e) {
      Toast.error(e.message || 'Erreur lors de l\'annulation');
    }
  }

  function buildPagination(totalPages, currentPage) {
    const ul = document.getElementById('pagination');
    ul.innerHTML = '';
    if (totalPages <= 1) return;
    for (let i = 0; i < totalPages; i++) {
      ul.innerHTML += `<li class="page-item ${i === currentPage ? 'active' : ''}">
        <a class="page-link" href="#" onclick="loadOrders(${i})">${i + 1}</a></li>`;
    }
  }

  initUserInfo();
  loadOrders();
</script>
</body>
</html>
