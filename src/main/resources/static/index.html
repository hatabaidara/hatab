<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shaoume Global Business</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1E293B 0%, #2563EB 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash-card {
      background: white;
      border-radius: 20px;
      padding: 50px 40px;
      text-align: center;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 25px 60px rgba(0,0,0,0.3);
    }
    .logo { font-size: 3rem; color: #2563EB; margin-bottom: 10px; }
    .brand { font-size: 1.8rem; font-weight: 800; color: #1E293B; }
    .brand span { color: #2563EB; }
    .tagline { color: #64748B; margin-bottom: 40px; }
    .btn-start {
      background: #2563EB;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 40px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-start:hover {
      background: #1D4ED8;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37,99,235,0.4);
      color: white;
    }
    .btn-secondary-link {
      display: block;
      margin-top: 16px;
      color: #64748B;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .btn-secondary-link:hover { color: #2563EB; }
    .features {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin: 32px 0;
      flex-wrap: wrap;
    }
    .feature {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #64748B;
    }
    .feature i { font-size: 1.5rem; color: #2563EB; }
  </style>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563EB">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Shaoume">
</head>
<body>
  <div class="splash-card">
    <div class="logo"><i class="bi bi-globe2"></i></div>
    <div class="brand">Shaoume <span>Global</span></div>
    <p class="tagline mt-2">Votre plateforme e-commerce professionnelle</p>

    <div class="features">
      <div class="feature">
        <i class="bi bi-shield-check"></i>
        <span>Sécurisé</span>
      </div>
      <div class="feature">
        <i class="bi bi-lightning-charge"></i>
        <span>Rapide</span>
      </div>
      <div class="feature">
        <i class="bi bi-phone"></i>
        <span>Responsive</span>
      </div>
      <div class="feature">
        <i class="bi bi-truck"></i>
        <span>Livraison</span>
      </div>
    </div>

    <a href="pages/home.html" class="btn-start">
      <i class="bi bi-shop me-2"></i>Accéder à la boutique
    </a>
    <a href="pages/login.html" class="btn-secondary-link">
      <i class="bi bi-person me-1"></i>Se connecter à son compte
    </a>

    <div class="mt-4 pt-4 border-top">
      <p style="font-size:0.8rem;color:#94A3B8;margin:0">
        <i class="bi bi-lock me-1"></i>
        Connexion sécurisée JWT • API Spring Boot
      </p>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
  <script>
    // Redirection automatique si déjà connecté
    if (Auth.isLogged()) {
      window.location.href = Auth.isAdmin()
        ? 'pages/dashboard.html'
        : 'pages/home.html';
    }
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>
</html>
