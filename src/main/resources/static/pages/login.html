<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Shaoume Global Business</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body class="login-page">

  <div class="login-card">
    <!-- Logo -->
    <div class="login-logo">
      <i class="bi bi-globe2 text-primary"></i>
      Shaoume <span style="color:#1E293B">Global</span>
    </div>
    <p class="text-center text-muted mb-4" style="font-size:0.9rem">
      Connectez-vous à votre compte
    </p>

    <!-- Alert erreur -->
    <div id="alert-error" class="alert alert-danger d-none" role="alert">
      <i class="bi bi-exclamation-triangle me-2"></i>
      <span id="alert-message"></span>
    </div>

    <!-- Formulaire -->
    <form id="login-form" novalidate>
      <div class="mb-3">
        <label class="form-label">Adresse email</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0">
            <i class="bi bi-envelope text-muted"></i>
          </span>
          <input type="email" id="email" class="form-control border-start-0 ps-0"
            placeholder="exemple@email.com" required autocomplete="email">
        </div>
        <div class="invalid-feedback">Email invalide</div>
      </div>

      <div class="mb-4">
        <label class="form-label">Mot de passe</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0">
            <i class="bi bi-lock text-muted"></i>
          </span>
          <input type="password" id="password" class="form-control border-start-0 ps-0"
            placeholder="••••••••" required autocomplete="current-password">
          <button class="btn btn-light border" type="button" id="toggle-password">
            <i class="bi bi-eye" id="eye-icon"></i>
          </button>
        </div>
        <div class="invalid-feedback">Mot de passe requis</div>
      </div>

      <button type="submit" id="btn-login" class="btn btn-primary w-100 py-2">
        <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
      </button>
    </form>

    <hr class="my-4">

    <p class="text-center text-muted mb-0" style="font-size:0.85rem">
      Pas encore de compte ?
      <a href="register.html" class="text-primary fw-semibold text-decoration-none">
        Créer un compte
      </a>
    </p>

    <!-- Compte admin test -->
    <div class="mt-3 p-3 bg-light rounded-3" style="font-size:0.8rem">
      <p class="mb-1 fw-semibold text-muted">
        <i class="bi bi-info-circle me-1"></i>Compte Admin :
      </p>
      <code>admin@shaoume.com</code> / <code>Admin@2024!</code>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    // Rediriger si déjà connecté
    if (Auth.isLogged()) window.location.href = 'dashboard.html';

    // Toggle password
    document.getElementById('toggle-password').addEventListener('click', function() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'bi bi-eye';
      }
    });

    // Soumission formulaire
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn-login');
      const alertEl = document.getElementById('alert-error');
      const alertMsg = document.getElementById('alert-message');

      alertEl.classList.add('d-none');

      if (!email || !password) {
        this.classList.add('was-validated');
        return;
      }

      Loader.show(btn);
      try {
        const res = await Api.post('/auth/login', { email, password });
        Auth.setSession(res.data);
        Toast.success('Connexion réussie ! Redirection...');
        setTimeout(() => {
          window.location.href = Auth.isAdmin() ? 'dashboard.html' : 'home.html';
        }, 1000);
      } catch(err) {
        alertMsg.textContent = err.message || 'Email ou mot de passe incorrect';
        alertEl.classList.remove('d-none');
      } finally {
        Loader.hide(btn);
      }
    });
  </script>
</body>
</html>
