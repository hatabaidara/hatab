<style>
  * { font-family: "Inter", sans-serif; }
  body { background: #F1F5F9; }

  .order-card {
    background: white;
    border-radius: 20px;
    border: 1px solid #E2E8F0;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    margin-bottom: 20px;
  }
  .order-card:hover { box-shadow: 0 8px 32px rgba(37,99,235,0.12); transform: translateY(-2px); }

  .order-header {
    padding: 20px 24px;
    border-bottom: 1px solid #F1F5F9;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
    background: linear-gradient(135deg, #FAFBFC, #F8FAFC);
  }

  .order-number {
    font-weight: 800; font-size: 0.95rem;
    color: #0F172A; letter-spacing: -0.02em;
  }

  .order-date { font-size: 0.78rem; color: #94A3B8; margin-top: 2px; }

  .order-body { padding: 20px 24px; }

  /* Progress bar */
  .progress-track {
    position: relative; margin: 0 0 20px;
    padding: 0 12px;
  }
  .progress-line {
    position: absolute; top: 12px; left: 12%; right: 12%;
    height: 2px; background: #E2E8F0; z-index: 0;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, #2563EB, #60A5FA);
    transition: width 0.6s ease; border-radius: 2px;
  }
  .progress-steps { display: flex; justify-content: space-between; position: relative; z-index: 1; }
  .progress-step { text-align: center; }
  .step-dot {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 6px; font-size: 0.75rem; font-weight: 700;
    transition: all 0.3s;
  }
  .step-dot.done { background: #2563EB; color: white; box-shadow: 0 2px 8px rgba(37,99,235,0.4); }
  .step-dot.current { background: white; color: #2563EB; border: 2px solid #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
  .step-dot.pending { background: #F1F5F9; color: #CBD5E1; border: 2px solid #E2E8F0; }
  .step-label { font-size: 0.62rem; font-weight: 600; white-space: nowrap; }
  .step-label.done { color: #2563EB; }
  .step-label.current { color: #2563EB; font-weight: 700; }
  .step-label.pending { color: #CBD5E1; }

  /* Product items */
  .order-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; background: #F8FAFC;
    border-radius: 12px; border: 1px solid #E2E8F0;
    transition: all 0.2s;
  }
  .order-item:hover { background: #EFF6FF; border-color: #BFDBFE; }
  .order-item-img {
    width: 48px; height: 48px; min-width: 48px;
    border-radius: 10px; overflow: hidden;
    background: white; border: 1px solid #E2E8F0;
  }
  .order-item-img img { width: 100%; height: 100%; object-fit: cover; }

  /* Cancelled alert */
  .cancelled-alert {
    background: #FEF2F2; border: 1px solid #FECACA;
    border-radius: 12px; padding: 14px 18px;
    display: flex; align-items: center; gap: 10px;
    color: #DC2626; font-size: 0.875rem; font-weight: 600;
    margin-bottom: 16px;
  }

  /* Empty state */
  .empty-state {
    background: white; border-radius: 24px;
    border: 1px solid #E2E8F0; padding: 60px 40px;
    text-align: center;
  }
  .empty-icon {
    width: 80px; height: 80px; border-radius: 50%;
    background: #EFF6FF; display: flex; align-items: center;
    justify-content: center; margin: 0 auto 20px;
    font-size: 2rem; color: #2563EB;
  }

  /* Page header */
  .page-header {
    background: white; border-radius: 20px;
    border: 1px solid #E2E8F0; padding: 24px 28px;
    margin-bottom: 24px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
  }

  /* MOBILE ORDERS */
  @media (max-width: 768px) {
    body { background: #F8FAFC !important; }
    .order-card {
      border-radius: 16px !important;
      margin-bottom: 12px !important;
    }
    .order-header {
      padding: 14px 16px !important;
    }
    .order-body { padding: 14px 16px !important; }
    .order-number { font-size: 0.85rem !important; }
    .container { padding: 0 12px !important; }
    body { padding-bottom: 80px !important; }

    /* Header page */
    .page-header {
      background: linear-gradient(160deg, #0F172A, #1E3A8A) !important;
      padding: 20px 16px !important;
      color: white !important;
      border-radius: 0 0 24px 24px !important;
      margin-bottom: 16px !important;
    }
    .page-header h4 { color: white !important; font-size: 1.2rem !important; }
  }


  /* ORDERS MOBILE JUMIA STYLE */
  @media (max-width: 768px) {
    body { background: #F8FAFC !important; padding-bottom: 80px !important; }

    /* Header page */
    .orders-hero {
      background: linear-gradient(160deg, #0F172A, #1E3A8A) !important;
      padding: 20px 16px 32px !important;
      border-radius: 0 0 24px 24px !important;
      margin-bottom: 16px !important;
    }

    /* Navbar */
    .navbar { padding: 8px 12px !important; }

    /* Order cards */
    .order-card {
      border-radius: 16px !important;
      margin-bottom: 12px !important;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06) !important;
    }

    .order-header {
      padding: 12px 14px !important;
      gap: 8px !important;
    }

    .order-number { font-size: 0.82rem !important; }
    .order-date { font-size: 0.72rem !important; }

    .order-body { padding: 12px 14px !important; }

    /* Progress steps */
    .step-label { font-size: 0.55rem !important; }
    .step-dot { width: 22px !important; height: 22px !important; font-size: 0.65rem !important; }

    /* Container */
    .container { padding: 0 12px !important; }

    /* Titre page */
    h3 { font-size: 1.1rem !important; }

    /* Statut badge */
    .badge { font-size: 0.65rem !important; padding: 4px 8px !important; }

    /* Produit dans commande */
    .order-item-img {
      width: 50px !important;
      height: 50px !important;
      border-radius: 8px !important;
      object-fit: cover !important;
    }

    /* Bouton annuler */
    .btn-cancel {
      font-size: 0.78rem !important;
      padding: 6px 12px !important;
    }
  }

</style>

<div class="container py-5">

  <div class="d-flex align-items-center gap-3 mb-4">
    <h3 class="fw-bold mb-0">Mes Commandes</h3>
    <span id="orders-badge" class="badge bg-primary">0 commandes</span>
  </div>

  <!-- Filtres statut -->
  <div class="d-flex gap-2 flex-wrap mb-4" id="status-filters">
    <button class="btn btn-primary btn-sm" onclick="filterOrders(null, this)">Tous</button>
    <button class="btn btn-outline-warning btn-sm" onclick="filterOrders('PENDING', this)">En attente</button>
    <button class="btn btn-outline-info btn-sm" onclick="filterOrders('CONFIRMED', this)">Confirmées</button>
    <button class="btn btn-outline-primary btn-sm" onclick="filterOrders('PROCESSING', this)">En cours</button>
    <button class="btn btn-outline-secondary btn-sm" onclick="filterOrders('SHIPPED', this)">Expédiées</button>
    <button class="btn btn-outline-success btn-sm" onclick="filterOrders('DELIVERED', this)">Livrées</button>

<div class="modal fade" id="orderModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">Détail de la commande</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="order-detail-body">
        <div class="text-center py-4"><div class="spinner-border text-primary"></div></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  if (!checkAuth()) {}
  let currentPage = 0;

  // Icône par statut
  const statusIcons = {
    PENDING: 'bi-clock text-warning',
    CONFIRMED: 'bi-check-circle text-info',
    PROCESSING: 'bi-gear text-primary',
    SHIPPED: 'bi-truck text-secondary',
    DELIVERED: 'bi-check-circle-fill text-success',
    CANCELLED: 'bi-x-circle text-danger',
    REFUNDED: 'bi-arrow-counterclockwise text-warning',
  };

  const statusSteps = ['PENDING', 'CONFIRMED', 'PROCESSING', 'SHIPPED', 'DELIVERED'];

  function getStepIndex(status) {
    return statusSteps.indexOf(status);
  }

  async function loadOrders(page = 0) {
    currentPage = page;
    const container = document.getElementById('orders-list');
    container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';

    try {
      const url = currentFilter ? `/orders/my-orders?page=${page}&size=5&sort=createdAt,desc&status=${currentFilter}` : `/orders/my-orders?page=${page}&size=5&sort=createdAt,desc`;
      const res = await Api.get(url);
      const data = res.data;
      const orders = data?.content || [];
      const total = data?.totalElements || 0;

      document.getElementById('orders-badge').textContent = total + ' commandes';

      if (orders.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon"><i class="bi bi-bag"></i></div>
            <h5 class="fw-bold mb-2">Aucune commande</h5>
            <p class="text-muted mb-4">Vous n avez pas encore passe de commande</p>
            <a href="home.html" class="btn btn-primary px-4" style="border-radius:12px">
              <i class="bi bi-shop me-2"></i>Decouvrir nos produits
            </a>
          </div>`;
        return;
      }

      container.innerHTML = orders.map(o => {
        const stepIndex = getStepIndex(o.status);
        const isCancelled = o.status === 'CANCELLED';
        return `
          <div class="order-card">
            <!-- Header commande -->
            <div class="order-header">
              <div class="d-flex align-items-center gap-3">
                <i class="bi ${statusIcons[o.status] || 'bi-circle'} fs-5"></i>
                <div>
                  <div class="fw-bold">${o.orderNumber}</div>
                  <div class="text-muted" style="font-size:0.8rem">${Format.date(o.createdAt)}</div>
                </div>
              </div>
              <div class="d-flex align-items-center gap-3">
                <span class="fw-bold text-primary">${Format.currency(o.totalAmount)}</span>
                ${Format.statusBadge(o.status)}
                <button class="btn btn-sm btn-outline-primary" onclick="viewOrder('${o.orderNumber}')">
                  <i class="bi bi-eye me-1"></i>Détails
                </button>
              </div>
            </div>

            <div class="order-body">
              <!-- Progression -->
              ${!isCancelled ? `
              <div class="mb-4">
                <div class="d-flex justify-content-between position-relative" style="padding:0 10px">
                  <div class="position-absolute" style="top:12px;left:10%;right:10%;height:2px;background:#E5E7EB;z-index:0">
                    <div style="width:${Math.max(0, stepIndex / (statusSteps.length-1) * 100)}%;height:100%;background:#2563EB;transition:width 0.5s"></div>
                  </div>
                  ${statusSteps.map((step, i) => `
                    <div class="text-center position-relative" style="z-index:1">
                      <div class="mx-auto rounded-circle d-flex align-items-center justify-content-center"
                        style="width:24px;height:24px;background:${i <= stepIndex ? '#2563EB' : '#E5E7EB'};color:${i <= stepIndex ? 'white' : '#94A3B8'}">
                        <i class="bi ${i < stepIndex ? 'bi-check' : i === stepIndex ? 'bi-circle-fill' : 'bi-circle'}" style="font-size:0.7rem"></i>
                      </div>
                      <div style="font-size:0.65rem;color:${i <= stepIndex ? '#2563EB' : '#94A3B8'};margin-top:4px;white-space:nowrap">
                        ${['Commande', 'Confirmée', 'En cours', 'Expédiée', 'Livrée'][i]}
                      </div>
                    </div>`).join('')}
                </div>
              </div>` : `
              <div class="alert alert-danger d-flex align-items-center gap-2 mb-4" style="font-size:0.85rem">
                <i class="bi bi-x-circle-fill"></i>
                Cette commande a été annulée
              </div>`}

              <!-- Articles -->
              <div class="d-flex gap-3 flex-wrap">
                ${(o.orderItems || []).slice(0, 4).map(item => `
                  <div class="d-flex align-items-center gap-2 p-2 bg-light rounded-2">
                    <div class="rounded-2 overflow-hidden bg-white" style="width:44px;height:44px;min-width:44px">
                      ${item.product?.imageUrl
                        ? `<img loading="lazy" src="${item.product.imageUrl}" style="width:44px;height:44px;object-fit:cover">`
                        : `<div class="d-flex align-items-center justify-content-center h-100"><i class="bi bi-image text-muted"></i></div>`}
                    </div>
                    <div>
                      <div style="font-size:0.8rem;font-weight:600">${item.product?.name || 'Produit'}</div>
                      <div style="font-size:0.75rem;color:#64748B">x${item.quantity} • ${Format.currency(item.unitPrice)}</div>
                    </div>
                  </div>`).join('')}
                ${o.orderItems?.length > 4 ? `<div class="d-flex align-items-center p-2 text-muted" style="font-size:0.8rem">+${o.orderItems.length - 4} autres</div>` : ''}
              </div>

              <!-- Actions -->
              <div class="d-flex gap-2 mt-3">
                ${o.status === 'PENDING' || o.status === 'CONFIRMED' ? `
                <button class="btn btn-outline-danger btn-sm" onclick="cancelOrder(${o.id})">
                  <i class="bi bi-x-lg me-1"></i>Annuler
                </button>` : ''}
                ${o.status === 'DELIVERED' ? `
                <button class="btn btn-outline-success btn-sm" onclick="reorder('${o.id}')">
                  <i class="bi bi-arrow-repeat me-1"></i>Commander à nouveau
                </button>` : ''}
              </div>
            </div>
          </div>`;
      }).join('');

      buildPagination(data.totalPages, page);
    } catch(e) {
      container.innerHTML = '<div class="order-card text-center text-danger py-4"><i class="bi bi-exclamation-triangle me-2"></i>Erreur de chargement</div>';
    }
  }

  async function viewOrder(orderNumber) {
    const body = document.getElementById('order-detail-body');
    body.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';
    new bootstrap.Modal(document.getElementById('orderModal')).show();
    try {
      const res = await Api.get('/orders/number/' + orderNumber);
      const o = res.data;
      body.innerHTML = `
        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <div class="p-3 bg-light rounded-3">
              <div class="fw-semibold mb-2"><i class="bi bi-geo-alt me-2 text-primary"></i>Livraison</div>
              <div>${o.shippingAddress}</div>
              <div class="text-muted">${o.shippingCity}, ${o.shippingCountry}</div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="p-3 bg-light rounded-3">
              <div class="fw-semibold mb-2"><i class="bi bi-credit-card me-2 text-primary"></i>Paiement</div>
              <div>${o.payment?.method || 'N/A'}</div>
              <div>${Format.statusBadge(o.status)}</div>
            </div>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-sm">
            <thead><tr><th>Produit</th><th>Qté</th><th>Prix unit.</th><th>Total</th></tr></thead>
            <tbody>
              ${(o.orderItems || []).map(item => `
                <tr>
                  <td>${item.product?.name}</td>
                  <td>${item.quantity}</td>
                  <td>${Format.currency(item.unitPrice)}</td>
                  <td class="fw-semibold">${Format.currency(item.totalPrice)}</td>
                </tr>`).join('')}
            </tbody>
            <tfoot>
              <tr class="table-light">
                <td colspan="3" class="fw-bold text-end">Total</td>
                <td class="fw-bold text-primary">${Format.currency(o.totalAmount)}</td>
              </tr>
            </tfoot>
          </table>
        </div>`;
    } catch(e) {
      body.innerHTML = '<div class="text-center text-danger py-4">Erreur de chargement</div>';
    }
  }

  async function cancelOrder(id) {
    if (!confirm('Confirmer l\'annulation de cette commande ?')) return;
    try {
      await Api.post(`/orders/${id}/cancel`);
      Toast.success('Commande annulée');
      loadOrders(currentPage);
    } catch(e) {
      Toast.error(e.message || 'Erreur lors de l\'annulation');
    }
  }

  function buildPagination(totalPages, currentPage) {
    const ul = document.getElementById('pagination');
    ul.innerHTML = '';
    if (totalPages <= 1) return;
    for (let i = 0; i < totalPages; i++) {
      ul.innerHTML += `<li class="page-item ${i === currentPage ? 'active' : ''}">
        <a class="page-link" href="#" onclick="loadOrders(${i})">${i + 1}</a></li>`;
    }
  }

  let currentFilter = null;

  function filterOrders(status, btn) {
    currentFilter = status;
    document.querySelectorAll('#status-filters button').forEach(b => {
      b.className = b.className.replace('btn-primary', 'btn-outline-primary')
                               .replace(/btn-warning/, 'btn-outline-warning')
                               .replace(/btn-info/, 'btn-outline-info')
                               .replace(/btn-secondary/, 'btn-outline-secondary')
                               .replace(/btn-success/, 'btn-outline-success')
                               .replace(/btn-danger/, 'btn-outline-danger');
    });
    if (status === null) {
      btn.className = btn.className.replace('btn-outline-primary', 'btn-primary');
    } else {
      btn.className = btn.className
        .replace('btn-outline-warning', 'btn-warning')
        .replace('btn-outline-info', 'btn-info')
        .replace('btn-outline-primary', 'btn-primary')
        .replace('btn-outline-secondary', 'btn-secondary')
        .replace('btn-outline-success', 'btn-success')
        .replace('btn-outline-danger', 'btn-danger');
    }
    loadOrders(0);
  }

  async function reorder(id) {
    try {
      await Api.post(`/orders/${id}/reorder`);
      Toast.success('Articles ajoutés au panier !');
      setTimeout(() => window.location.href = 'cart.html', 1200);
    } catch(e) {
      Toast.error(e.message || 'Erreur lors du ré-achat');
    }
  }

    }
  }
  initUserInfo();

</script>
