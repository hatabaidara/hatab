<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panier - Shaoume Global Business</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563EB">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Shaoume">
<script>
    const _t = localStorage.getItem("token");
    const _u = JSON.parse(localStorage.getItem("user") || "{}");
    if (!_t || _u.role !== "ADMIN") { window.location.href = "admin-login.html"; }
  </script>
</head>
<body style="background:#F8FAFC">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="home.html">
      <i class="bi bi-globe2 me-2"></i>Shaoume <span class="text-dark">Global</span>
    </a>
    <div class="d-flex align-items-center gap-3">
      <a href="register-seller.html" class="btn btn-outline-success btn-sm" style="border-radius:10px"><i class="bi bi-shop me-1"></i>Vendre</a>
      
      <a href="home.html" class="btn btn-light btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Continuer les achats
      </a>
      <div class="avatar" id="user-avatar" style="width:36px;height:36px;font-size:0.8rem">AD</div>
    </div>
  </div>
</nav>

<div class="container py-5">

  <div class="d-flex align-items-center gap-3 mb-4">
    <h3 class="fw-bold mb-0">Mon Panier</h3>
    <span id="cart-count-badge" class="badge bg-primary">0 articles</span>
  </div>

  <div class="row g-4">

    <!-- Articles -->
    <div class="col-lg-8">
      <div class="content-card">
        <div id="cart-items">
          <div class="text-center py-5">
            <div class="spinner-border text-primary"></div>
            <p class="text-muted mt-2">Chargement...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Résumé -->
    <div class="col-lg-4">
      <div class="content-card p-4 sticky-top" style="top:80px">
        <h6 class="fw-bold mb-4">Résumé de la commande</h6>

        <div class="d-flex justify-content-between mb-2" style="font-size:0.9rem">
          <span class="text-muted">Sous-total</span>
          <span id="subtotal" class="fw-semibold">-</span>
        </div>
        <div class="d-flex justify-content-between mb-2" style="font-size:0.9rem">
          <span class="text-muted">Livraison</span>
          <span class="text-success fw-semibold">Gratuite</span>
        </div>
        <hr>
        <div class="d-flex justify-content-between mb-4">
          <span class="fw-bold">Total</span>
          <span class="fw-bold text-primary fs-5" id="total">-</span>
        </div>

        <button class="btn btn-primary w-100 py-2 mb-3" id="btn-checkout" onclick="goToCheckout()">
          <i class="bi bi-bag-check me-2"></i>Passer la commande
        </button>

        <button class="btn btn-outline-danger w-100 btn-sm" onclick="clearCart()">
          <i class="bi bi-trash me-2"></i>Vider le panier
        </button>

        <div class="mt-4 p-3 bg-light rounded-3">
          <div class="d-flex align-items-center gap-2 text-muted mb-2" style="font-size:0.8rem">
            <i class="bi bi-shield-check text-success"></i>
            Paiement 100% sécurisé
          </div>
          <div class="d-flex align-items-center gap-2 text-muted mb-2" style="font-size:0.8rem">
            <i class="bi bi-truck text-primary"></i>
            Livraison rapide
          </div>
          <div class="d-flex align-items-center gap-2 text-muted" style="font-size:0.8rem">
            <i class="bi bi-arrow-repeat text-warning"></i>
            Retour facile sous 30 jours
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- MODAL COMMANDE -->
<div class="modal fade" id="checkoutModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">Finaliser la commande</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="checkout-form">
          <div class="row g-3">
            <div class="col-12">
              <h6 class="fw-bold text-primary mb-3">
                <i class="bi bi-geo-alt me-2"></i>Adresse de livraison
              </h6>
            </div>
            <div class="col-12">
              <label class="form-label">Adresse complète *</label>
              <input type="text" id="shipping-address" class="form-control" required placeholder="Rue, quartier...">
            </div>
            <div class="col-md-6">
              <label class="form-label">Ville *</label>
              <input type="text" id="shipping-city" class="form-control" required placeholder="Conakry">
            </div>
            <div class="col-md-6">
              <label class="form-label">Pays *</label>
              <input type="text" id="shipping-country" class="form-control" required placeholder="Guinée">
            </div>
            <div class="col-md-6">
              <label class="form-label">Code postal</label>
              <input type="text" id="shipping-postal" class="form-control" placeholder="00224">
            </div>
            <div class="col-12">
              <h6 class="fw-bold text-primary mb-3 mt-2">
                <i class="bi bi-credit-card me-2"></i>Mode de paiement
              </h6>
            </div>
            <div class="col-12">
              <div class="row g-3">
                <div class="col-6 col-md-4">
                  <input type="radio" class="btn-check" name="payment" id="pay-cash" value="CASH_ON_DELIVERY" checked>
                  <label class="btn btn-outline-secondary w-100 py-3" for="pay-cash">
                    <i class="bi bi-cash-stack d-block fs-4 mb-1"></i>
                    <span style="font-size:0.8rem">À la livraison</span>
                  </label>
                </div>
                <div class="col-6 col-md-4">
                  <input type="radio" class="btn-check" name="payment" id="pay-mobile" value="MOBILE_MONEY">
                  <label class="btn btn-outline-secondary w-100 py-3" for="pay-mobile">
                    <i class="bi bi-phone d-block fs-4 mb-1"></i>
                    <span style="font-size:0.8rem">Mobile Money</span>
                  </label>
                </div>
                <div class="col-6 col-md-4">
                  <input type="radio" class="btn-check" name="payment" id="pay-card" value="CREDIT_CARD">
                  <label class="btn btn-outline-secondary w-100 py-3" for="pay-card">
                    <i class="bi bi-credit-card d-block fs-4 mb-1"></i>
                    <span style="font-size:0.8rem">Carte bancaire</span>
                  </label>
                </div>
              </div>
            </div>
            <div class="col-12">
              <label class="form-label">Notes (optionnel)</label>
              <textarea id="order-notes" class="form-control" rows="2" placeholder="Instructions spéciales..."></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0">
        <button class="btn btn-light" data-bs-dismiss="modal">Annuler</button>
        <button class="btn btn-primary px-4" id="btn-place-order" onclick="placeOrder()">
          <i class="bi bi-check-lg me-2"></i>Confirmer la commande
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  if (!checkAuth()) {}
  let cartItems = [];

  async function loadCart() {
    const container = document.getElementById('cart-items');
    try {
      const res = await Api.get('/cart');
      cartItems = res.data || [];
      document.getElementById('cart-count-badge').textContent = cartItems.length + ' articles';

      if (cartItems.length === 0) {
        container.innerHTML = `
          <div class="text-center py-5">
            <i class="bi bi-bag fs-1 text-muted d-block mb-3"></i>
            <h5 class="text-muted">Votre panier est vide</h5>
            <p class="text-muted mb-4">Découvrez nos produits et ajoutez-les à votre panier</p>
            <a href="home.html" class="btn btn-primary">
              <i class="bi bi-shop me-2"></i>Voir les produits
            </a>
          </div>`;
        document.getElementById('subtotal').textContent = Format.currency(0);
        document.getElementById('total').textContent = Format.currency(0);
        document.getElementById('btn-checkout').disabled = true;
        return;
      }

      let subtotal = 0;
      container.innerHTML = cartItems.map(item => {
        const price = item.product?.discountPrice || item.product?.price || 0;
        const itemTotal = price * item.quantity;
        subtotal += itemTotal;
        return `
          <div class="d-flex align-items-center gap-3 p-4 border-bottom" id="cart-item-${item.id}">
            <div class="rounded-2 overflow-hidden bg-light flex-shrink-0"
              style="width:80px;height:80px">
              ${item.product?.imageUrl
                ? `<img src="${item.product.imageUrl}" style="width:80px;height:80px;object-fit:cover">`
                : `<div class="d-flex align-items-center justify-content-center h-100"><i class="bi bi-image text-muted fs-4"></i></div>`}
            </div>
            <div class="flex-grow-1">
              <div class="fw-semibold mb-1">${item.product?.name}</div>
              <div class="text-primary fw-bold">${Format.currency(price)}</div>
            </div>
            <div class="d-flex align-items-center gap-2">
              <button class="btn btn-light btn-sm" onclick="updateQty(${item.id}, ${item.quantity - 1})">
                <i class="bi bi-dash"></i>
              </button>
              <span class="fw-bold px-2">${item.quantity}</span>
              <button class="btn btn-light btn-sm" onclick="updateQty(${item.id}, ${item.quantity + 1})">
                <i class="bi bi-plus"></i>
              </button>
            </div>
            <div class="text-end" style="min-width:100px">
              <div class="fw-bold">${Format.currency(itemTotal)}</div>
              <button class="btn btn-link text-danger btn-sm p-0 mt-1" onclick="removeItem(${item.id})">
                <i class="bi bi-trash"></i> Retirer
              </button>
            </div>
          </div>`;
      }).join('');

      document.getElementById('subtotal').textContent = Format.currency(subtotal);
      document.getElementById('total').textContent = Format.currency(subtotal);
      document.getElementById('btn-checkout').disabled = false;
    } catch(e) {
      container.innerHTML = '<div class="text-center text-danger py-4">Erreur de chargement</div>';
    }
  }

  async function updateQty(id, qty) {
    if (qty < 0) return;
    try {
      await Api.put(`/cart/${id}?quantity=${qty}`);
      loadCart();
    } catch(e) { Toast.error(e.message || 'Erreur'); }
  }

  async function removeItem(id) {
    try {
      await Api.delete('/cart/' + id);
      Toast.info('Article retiré du panier');
      loadCart();
    } catch(e) { Toast.error(e.message || 'Erreur'); }
  }

  async function clearCart() {
    if (!confirm('Vider tout le panier ?')) return;
    try {
      await Api.delete('/cart/clear');
      Toast.info('Panier vidé');
      loadCart();
    } catch(e) { Toast.error(e.message || 'Erreur'); }
  }

  function goToCheckout() {
    if (cartItems.length === 0) { Toast.warning('Votre panier est vide'); return; }
    new bootstrap.Modal(document.getElementById('checkoutModal')).show();
  }

  async function placeOrder() {
    const btn = document.getElementById('btn-place-order');
    const address = document.getElementById('shipping-address').value.trim();
    const city = document.getElementById('shipping-city').value.trim();
    const country = document.getElementById('shipping-country').value.trim();
    const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
    const notes = document.getElementById('order-notes').value.trim();

    if (!address || !city || !country) {
      Toast.warning('Veuillez remplir l\'adresse de livraison');
      return;
    }

    const items = cartItems.map(item => ({
      productId: item.product.id,
      quantity: item.quantity
    }));

    Loader.show(btn);
    try {
      await Api.post('/orders', {
        items, shippingAddress: address, shippingCity: city,
        shippingCountry: country, notes, paymentMethod
      });
      await Api.delete('/cart/clear');
      bootstrap.Modal.getInstance(document.getElementById('checkoutModal')).hide();
      Toast.success('Commande passée avec succès !');
      setTimeout(() => window.location.href = 'my-orders.html', 1500);
    } catch(e) {
      Toast.error(e.message || 'Erreur lors de la commande');
    } finally {
      Loader.hide(btn);
    }
  }

  initUserInfo();
  loadCart();
</script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>
</html>
