<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    * { font-family: 'Segoe UI', sans-serif; }
    body { background: #0F172A; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .admin-card { background: #1E293B; border: 1px solid #334155; border-radius: 12px; padding: 40px; width: 100%; max-width: 380px; }
    .admin-title { color: #94A3B8; font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 24px; }
    .form-control { background: #0F172A; border: 1px solid #334155; color: #E2E8F0; border-radius: 8px; padding: 10px 14px; }
    .form-control:focus { background: #0F172A; border-color: #475569; color: #E2E8F0; box-shadow: none; }
    .form-control::placeholder { color: #475569; }
    .form-label { color: #64748B; font-size: 0.8rem; margin-bottom: 6px; }
    .btn-admin { background: #334155; border: none; color: #E2E8F0; width: 100%; padding: 10px; border-radius: 8px; font-size: 0.9rem; transition: all 0.2s; }
    .btn-admin:hover { background: #475569; color: white; }
    .error-box { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #EF4444; border-radius: 8px; padding: 10px 14px; font-size: 0.82rem; margin-bottom: 16px; display: none; }
    @media (max-width: 768px) {
    body { background: #0F172A !important; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 16px; }
    .admin-box {
      background: #1E293B; border-radius: 24px; padding: 32px 24px;
      width: 100%; max-width: 400px;
      box-shadow: 0 24px 48px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .form-control { font-size: 16px !important; padding: 13px 14px !important; border-radius: 14px !important; background: rgba(255,255,255,0.05) !important; border-color: rgba(255,255,255,0.1) !important; color: white !important; }
    .form-control::placeholder { color: rgba(255,255,255,0.3) !important; }
    .btn { padding: 16px !important; border-radius: 14px !important; font-size: 1rem !important; font-weight: 700 !important; width: 100% !important; }
  }
</style>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563EB">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Shaoume">
</head>
<body>
  <div class="admin-card">
    <p class="admin-title"><i class="bi bi-shield-lock me-2"></i>Accès restreint</p>
    <div class="error-box" id="errorBox">Identifiants incorrects.</div>
    <div class="mb-3">
      <label class="form-label">Identifiant</label>
      <input type="email" class="form-control" id="email" placeholder="admin@shaoume.com">
    </div>
    <div class="mb-4">
      <label class="form-label">Mot de passe</label>
      <input type="password" class="form-control" id="password" placeholder="••••••••">
    </div>
    <button class="btn-admin" id="btn" onclick="handleLogin()">
      <span id="btn-text">Accéder</span>
    </button>
  </div>

  <script>
    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn');
      const btnText = document.getElementById('btn-text');
      const errorBox = document.getElementById('errorBox');
      errorBox.style.display = 'none';
      if (!email || !password) { errorBox.textContent = 'Veuillez remplir tous les champs.'; errorBox.style.display = 'block'; return; }
      btn.disabled = true;
      btnText.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Erreur');
        const user = data.data?.user;
        if (user?.role !== 'ADMIN') { throw new Error('Accès non autorisé.'); }
        localStorage.setItem('token', data.data.accessToken);
        localStorage.setItem('user', JSON.stringify(user));
        window.location.href = 'dashboard.html';
      } catch(e) {
        errorBox.textContent = e.message || 'Identifiants incorrects.';
        errorBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Accéder';
      }
    }
    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
    // Vérifier si déjà connecté admin
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (user.role === 'ADMIN' && localStorage.getItem('token')) window.location.href = 'dashboard.html';
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>
</html>
