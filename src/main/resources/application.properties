server.port=8081
spring.application.name=shaoume-global-business
spring.datasource.url=jdbc:mysql://localhost:3306/shaoume_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
app.jwt.secret=ShauomeGlobalBusinessSecretKey2024VeryLongAndSecureSecretKeyForJWTTokenGeneration
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000
app.jwt.header=Authorization
app.jwt.prefix=Bearer
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
logging.level.com.shaoume=DEBUG
app.cors.allowed-origins=http://localhost:8081,http://localhost:5500,null
app.upload.dir=uploads
